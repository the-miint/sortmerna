name: build multi-platform

on:
  pull_request:
    branches:
      - main
  push:
  #  branches:
  #    - main
  workflow_dispatch:

concurrency: 
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}


permissions:
  contents: read
    

jobs:
  build-multi-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        #exclude:
        #  - os: ubuntu-latest
        #  - os: macos-latest
    steps:
    - name: git checkout
      uses: actions/checkout@v5

    - name: build on linux
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y gcc-11 g++-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
        gcc --version
        eval "$(conda shell.bash activate)"
        conda install -c conda-forge -y pyyaml jinja2 requests ninja cmake
        python setup.py -n all
        echo "=== listing dist/ ==="
        ls -l ./dist

    - name: test on linux
      if: runner.os == 'Linux'
      run: |
        eval "$(conda shell.bash activate)"
        ctest --test-dir build -C Release --output-on-failure

    - name: build on macOS
      # latest macos is arm64 based
      if: runner.os == 'macOS'
      run: |
        wget "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
        bash Miniforge3-$(uname)-$(uname -m).sh -b -p "${HOME}/conda"
        source "${HOME}/conda/etc/profile.d/conda.sh"
        source "${HOME}/conda/etc/profile.d/mamba.sh"
        #conda activate
        eval "$(conda shell.bash activate)"
        mamba install -c conda-forge -y pyyaml jinja2 requests ninja cmake
        source "${HOME}/conda/etc/profile.d/conda.sh"
        source "${HOME}/conda/etc/profile.d/mamba.sh"
        conda activate
        conda env list
        python setup.py -n all
        echo "=== listing dist/ ==="
        ls -l ./dist

    - name: test on macOS
      if: runner.os == 'macOS'
      run: |
        source "${HOME}/conda/etc/profile.d/conda.sh"
        conda activate
        ctest --test-dir build -C Release --output-on-failure

    - name: build windows
      if: runner.os == 'Windows'
      env:
        CC: cl
      run: |
        & "$env:CONDA/shell/condabin/conda-hook.ps1"
        & "$env:programfiles/Microsoft Visual Studio/2022/Enterprise/Common7/Tools/Launch-VsDevShell.ps1" -arch amd64
        conda activate $env:CONDA
        conda install -c conda-forge -y pyyaml jinja2 requests ninja cmake
        echo "cmake version: $(cmake --version)"
        pushd $env:GITHUB_WORKSPACE
        echo 'running python setup.py ... in $(pwd)'
        python setup.py -n all
        echo "=== listing dist/ ==="
        ls -l ./dist
        # Note: tests are POSIX-only (pthread.h, unistd.h) and disabled for
        # Windows via CMakePresets.json (WIN_release sets WITH_TESTS=false).
